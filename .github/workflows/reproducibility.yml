name: Reproducibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Test
        run: python -m pytest -q

      - name: Generate four-qubit artifacts
        run: python scripts/run_experiments.py --out artifacts

      - name: Generate partition robustness artifacts
        run: python scripts/run_partition_experiments.py --out artifacts --samples 2000 --seed 2026

      - name: Generate exhaustive scaling artifacts
        run: python scripts/run_exhaustive_scaling.py --out artifacts --samples 500 --seed 2026

      - name: Generate OQM Gaussian-rate exhaustive artifacts
        run: python scripts/run_oqm_exhaustive.py --out artifacts --samples 500 --seed 2026

      - name: Generate OQM independent controls
        run: python scripts/run_oqm_controls.py --out artifacts --samples 300 --seed 2027

      - name: Generate dimensionless OQM controls
        run: python scripts/run_dimensionless_controls.py --out artifacts --samples 300 --seed 2028

      - name: Generate noncommuting XYZ OQM controls
        run: python scripts/run_noncommuting_controls.py --out artifacts --samples 300 --seed 2029

      - name: Build frozen paper-facing claims
        run: python scripts/build_paper_artifacts.py

      - name: Build publication figures
        run: python scripts/build_figures.py

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: workload-mereology-results
          path: artifacts/
          if-no-files-found: error
