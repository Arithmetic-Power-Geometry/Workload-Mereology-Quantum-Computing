name: Reproducibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Test
        run: python -m pytest -q

      - name: Generate reproducibility artifacts
        run: python scripts/run_experiments.py --out artifacts

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: workload-mereology-results
          path: artifacts/
          if-no-files-found: error
