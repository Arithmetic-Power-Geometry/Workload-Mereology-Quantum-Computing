[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "wmqc"
version = "0.1.0"
description = "Reference implementation for workload-mereology competition in quantum computing"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3"]

[tool.setuptools.packages.find]
where = ["src"]
